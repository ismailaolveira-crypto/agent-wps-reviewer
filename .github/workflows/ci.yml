name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Validate agent contract
        run: npm run validate:agent-contract

      - name: Validate Skill pressure gates
        run: npm run validate:skill-pressure

      - name: Validate GitHub source readiness
        run: npm run github:preflight

      - name: Build sanitized release package
        run: npm run release

      - name: Verify clean release installation
        run: npm run validate:release-install

      - name: Verify release manifest
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const manifest = JSON.parse(await readFile(`dist/${pkg.name}-${pkg.version}-manifest.json`, 'utf8'));
          const forbidden = manifest.files.filter((file) =>
            file.startsWith('data/') ||
            file.startsWith('output/') ||
            file.startsWith('test/') ||
            file.startsWith('docs/superpowers/') ||
            file.includes('/Users/')
          );
          if (forbidden.length) throw new Error(`Forbidden release files: ${forbidden.join(', ')}`);
          for (const required of [
            'skills/whitepaper-chief-editor/SKILL.md',
            'skills/whitepaper-wps-reviewer/SKILL.md',
            'config/product-manifest.json'
          ]) {
            if (!manifest.files.includes(required)) throw new Error(`Missing release file: ${required}`);
          }
          console.log(JSON.stringify({ fileCount: manifest.files.length, ok: true }));
          NODE

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Windows platform tests
        run: node --test test/windows-platform.test.mjs test/mcp-config.test.mjs test/wps-diagnostics.test.mjs

      - name: Validate Windows entry points
        shell: pwsh
        run: |
          if (-not (Test-Path .\setup.cmd)) { throw 'setup.cmd missing' }
          node --check .\src\platform.mjs
          node --check .\src\install\stableWindowsBundle.mjs
          node --check .\scripts\setup.mjs
          node --check .\src\install\launchAgent.mjs
          node --check .\src\bridge\processControl.mjs
          npm run validate:agent-contract

  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run macOS runtime regression
        run: node --test test/launch-agent.test.mjs test/process-control.test.mjs test/local-install.test.mjs test/mcp-config.test.mjs
